# Workflow name
name: CI

# Triggers
on:
  push:
    branches:
      - 'main'
      - 'v*-dev'
  pull_request:
    # labeled/unlabeled re-run the semver check when the override label changes
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
    branches:
      - 'main'
      - 'v*-dev'

# Jobs/Pipelines
jobs:
  phpstan:
    name: 'PHP Stan'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup PHP with tools"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          tools: composer, phpstan:1

      - name: "Get composer cache directory"
        id: composer-cache
        run: 'echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT'

      - name: "Cache dependencies"
        uses: actions/cache@v4
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "${{ runner.os }}-php-${{ matrix.php}}-composer-${{ hashFiles('**/composer.json') }}"
          restore-keys: "${{ runner.os }}-php-${{ matrix.php}}-composer-"

      - name: "Install Composer dependencies"
        run: composer install --no-ansi --no-interaction --no-progress --no-scripts --prefer-dist

      - name: "Run PHPStan Static Analysis"
        run: phpstan analyse

  phpunit:
    name: 'PHPUnit'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup PHP with tools"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          tools: composer

      - name: "Get composer cache directory"
        id: composer-cache
        run: 'echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT'

      - name: "Cache dependencies"
        uses: actions/cache@v4
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "${{ runner.os }}-php-${{ matrix.php}}-composer-${{ hashFiles('**/composer.json') }}"
          restore-keys: "${{ runner.os }}-php-${{ matrix.php}}-composer-"

      - name: "Install Composer dependencies"
        run: composer install --no-ansi --no-interaction --no-progress --no-scripts --prefer-dist

      - name: "Run PHPUnit"
        run: vendor/bin/phpunit

  php-cs-fixer:
    name: 'PHP-CS-Fixer'
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      # the bundled php-cs-fixer phar supports PHP 7.4 to 8.3
      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: "Check coding standards"
        run: php bin/php-cs-fixer-v3.phar fix --config=.php-cs-fixer.dist.php --dry-run --diff

  # A release's notes cannot change after its tag. A merge of a branch that predates the release can
  # put Unreleased entries under the released heading without a conflict.
  changelog:
    name: 'Changelog'
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          # the tags hold the released notes
          fetch-depth: 0

      - name: "Check released notes are unchanged"
        run: .github/scripts/changelog.sh verify

  # Compare the package contract with the latest tag on the target release line: DataSet rules,
  # Category method signatures and composer.json require constraints. Breaking changes fail on
  # maintenance branches and on release PRs that do not bump the major; on main they only warn.
  semver:
    name: 'Semver'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # comment the findings on the PR
      pull-requests: write
    env:
      OVERRIDE_LABEL: 'semver: not breaking'
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Select baseline"
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR: ${{ github.event.pull_request.number }}
          # fork PRs get a read-only token, so they cannot be commented on
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          skip() { echo "::notice title=Semver::$1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }

          [ "$EVENT" = pull_request ] || skip "Runs on pull requests only"

          line="$(.github/scripts/release-line.sh "$BASE_REF" 2>/dev/null)" || skip "$BASE_REF is not a release branch"
          baseline="$(git tag --list "v$line*" --sort=-v:refname | head -n 1)"
          [ -n "$baseline" ] || skip "No v$line* tag to compare with"

          # breaking changes need a new major: fail where none can follow, warn on main
          fail=true
          version=''
          if [[ "$HEAD_REF" =~ ^release/v(([0-9]+)\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            baseline_major="${baseline#v}"
            [ "${BASH_REMATCH[2]}" -gt "${baseline_major%%.*}" ] && fail=false
          elif [ "$BASE_REF" = main ]; then
            fail=false
          fi

          override=false
          jq -e --arg label "$OVERRIDE_LABEL" 'index($label) != null' <<< "$LABELS" >/dev/null && override=true

          echo "Comparing with $baseline: fail=$fail, override=$override"
          {
            echo "skip=false"
            echo "baseline=$baseline"
            echo "version=$version"
            echo "fail=$fail"
            echo "override=$override"
            echo "pr=$PR"
            echo "comment=$SAME_REPO"
          } >> "$GITHUB_OUTPUT"

      - name: "Setup PHP"
        if: steps.select.outputs.skip == 'false'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: "Snapshot contracts"
        if: steps.select.outputs.skip == 'false'
        env:
          BASELINE: ${{ steps.select.outputs.baseline }}
        run: |
          snapshot=".github/scripts/semver/snapshot.php"
          composer install --no-ansi --no-interaction --no-progress --no-scripts --no-dev --prefer-dist
          php "$snapshot" > "$RUNNER_TEMP/head.json"

          git worktree add --detach "$RUNNER_TEMP/baseline" "$BASELINE"
          (cd "$RUNNER_TEMP/baseline" && composer install --no-ansi --no-interaction --no-progress --no-scripts --no-dev --prefer-dist)
          (cd "$RUNNER_TEMP/baseline" && php "$GITHUB_WORKSPACE/$snapshot") > "$RUNNER_TEMP/baseline.json"

          mkdir -p "$RUNNER_TEMP/semver"
          composer --working-dir="$RUNNER_TEMP/semver" require --no-ansi --no-interaction --no-progress composer/semver:^3.4

      - name: "Check changelog"
        id: changelog
        if: steps.select.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.select.outputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            entries="$(.github/scripts/changelog.sh notes "$VERSION")"
          else
            entries="$(.github/scripts/changelog.sh unreleased)"
          fi

          breaking=false
          grep -q '^- \*\*Breaking:\*\*' <<< "$entries" && breaking=true
          echo "breaking=$breaking" >> "$GITHUB_OUTPUT"

      - name: "Compare contracts"
        if: steps.select.outputs.skip == 'false'
        env:
          BASELINE: ${{ steps.select.outputs.baseline }}
          FAIL: ${{ steps.select.outputs.fail }}
          OVERRIDE: ${{ steps.select.outputs.override }}
          BREAKING_ENTRY: ${{ steps.changelog.outputs.breaking }}
        run: |
          flags=(--autoload="$RUNNER_TEMP/semver/vendor/autoload.php" --baseline="$BASELINE" --report="$RUNNER_TEMP/semver.md")
          [ "$FAIL" = true ] && flags+=(--fail)
          [ "$OVERRIDE" = true ] && flags+=(--override)
          [ "$BREAKING_ENTRY" = true ] && flags+=(--breaking-entry)

          status=0
          php .github/scripts/semver/compare.php "${flags[@]}" "$RUNNER_TEMP/baseline.json" "$RUNNER_TEMP/head.json" || status=$?
          cat "$RUNNER_TEMP/semver.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # post the report as one PR comment and update it on later runs; a failure here does not fail CI
      - name: "Comment on pull request"
        if: ${{ !cancelled() && steps.select.outputs.skip == 'false' && steps.select.outputs.comment == 'true' }}
        continue-on-error: true
        env:
          PR: ${{ steps.select.outputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/semver.md"
          [ -f "$report" ] || exit 0

          comment="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- semver-check -->"))) | .id' \
            | head -n 1)"

          if [ -n "$comment" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -F "body=@$report" >/dev/null
          # create a comment only once there is something to report
          elif grep -q '^| ' "$report"; then
            gh pr comment "$PR" --body-file "$report"
          fi

  # Single required status check for branch rules; passes only if every job above passed, so the
  # matrix can change without touching the rules
  ci:
    name: 'CI'
    if: always()
    needs: [ phpstan, phpunit, php-cs-fixer, changelog, semver ]
    runs-on: ubuntu-latest
    steps:
      - name: "Require every job to pass"
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
