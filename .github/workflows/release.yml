# Tag the merge commit of a release PR from prepare-release.yml and create the GitHub release from
# its changelog entries. Packagist picks up the new tag.
name: Release

on:
  pull_request:
    types: [ closed ]
    branches:
      - 'main'
      - 'v*-dev'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: 'Release'
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: "Read version"
        run: |
          version="${BRANCH#release/v}"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Branch $BRANCH does not name a MAJOR.MINOR.PATCH version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: "Create release"
        run: |
          .github/scripts/changelog.sh notes "$VERSION" > notes.md

          # a patch on a maintenance branch must not replace a newer release as Latest
          git fetch --quiet --tags origin
          highest="$( (git tag --list 'v*'; echo "v$VERSION") | sort -V | tail -n 1)"
          latest=false
          [ "$highest" = "v$VERSION" ] && latest=true

          gh release create "v$VERSION" --target "$MERGE_SHA" --title "v$VERSION" --notes-file notes.md --latest="$latest"

      - name: "Delete release branch"
        run: git push origin --delete "$BRANCH"
